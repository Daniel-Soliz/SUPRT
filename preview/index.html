<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f7"><title>SUPRT · Visualização do aplicativo</title><style>:root{--ink:#101820;--orange:#ff7628;--grey:#687586;--line:#e5e8eb;--bg:#f5f6f7}*{box-sizing:border-box}body{margin:0;background:#dce3e9;color:var(--ink);font:15px/1.42 system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{position:relative;max-width:430px;min-height:100dvh;margin:auto;background:var(--bg);overflow:hidden;box-shadow:0 0 55px #0d1c2b20}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:white}.brand{font-size:25px;font-weight:950;letter-spacing:-1.5px}.brand i{font-style:normal;color:var(--orange)}.history{background:#f0f2f5;border:0;border-radius:23px;padding:9px 12px;color:#273749;font-weight:700;font-size:12px}.intro{padding:23px 22px 13px;background:white}.intro h1{font-size:24px;line-height:1.18;margin:0 0 6px;letter-spacing:-.4px}.intro p{margin:0;color:var(--grey);font-size:14px}.address{margin:12px 22px 16px;background:white;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;padding:13px 15px;box-shadow:0 4px 15px #0d1c2b08}.address .symbol{font-size:26px;color:var(--orange);padding:0 12px 0 2px}.address b{display:block;font-size:10px;letter-spacing:1px;color:var(--grey)}.address input{border:0;outline:0;width:100%;padding:5px 0;color:var(--ink);font:inherit;background:transparent}.map{position:relative;height:260px;overflow:hidden;background-color:#dce9e6;background-image:linear-gradient(27deg,transparent 46%,#f9fcfb 47%,#f9fcfb 51%,transparent 52%),linear-gradient(124deg,transparent 45%,#f9fcfb 46%,#f9fcfb 51%,transparent 52%),linear-gradient(2deg,transparent 46%,#f9fcfb 47%,#f9fcfb 51%,transparent 52%);background-size:180px 120px,200px 150px,240px 90px}.block{position:absolute;background:#b8d9c7;border-radius:13px;opacity:.75}.b1{width:94px;height:52px;top:24px;left:16px;transform:rotate(14deg)}.b2{width:75px;height:105px;top:105px;right:18px;transform:rotate(-12deg)}.b3{width:100px;height:48px;bottom:18px;left:25px;transform:rotate(-12deg)}.pin{position:absolute;left:50%;top:39%;transform:translate(-50%,-50%);width:57px;height:57px;border-radius:50%;background:var(--ink);color:white;border:5px solid white;box-shadow:0 8px 24px #1117;display:grid;place-items:center;font-size:28px;animation:pulse 2.6s ease-in-out infinite}.mapnote{position:absolute;left:50%;top:65%;transform:translateX(-50%);white-space:nowrap;background:white;padding:9px 14px;border-radius:12px;box-shadow:0 4px 15px #24364722;font-size:11px;font-weight:750}.sheet{position:relative;margin-top:-22px;background:white;border-radius:26px 26px 0 0;padding:12px 19px 20px;box-shadow:0 -10px 25px #172e3c12}.handle{width:37px;height:4px;background:#d2d6da;border-radius:10px;margin:0 auto 18px}.sheet h2{margin:0 0 4px;font-size:21px}.sheet>p{color:var(--grey);font-size:13px;margin:0 0 13px}.service{display:flex;align-items:center;text-align:left;width:100%;border:0;border-top:1px solid var(--line);background:white;padding:13px 2px;transition:transform .18s,background .18s}.service:active{transform:scale(.98);background:#fff9f5}.icon{width:48px;height:48px;background:#fff1e7;color:var(--orange);display:grid;place-items:center;border-radius:14px;margin-right:13px;font-size:25px;font-weight:800}.desc{flex:1}.desc b{display:block;font-size:16px}.desc small{color:var(--grey);font-size:12px}.arrow{font-size:26px;color:#9ea8b0}.status{border-radius:11px;background:#e9f7ef;color:#1b885c;font-size:12px;font-weight:700;padding:10px 12px;margin-top:8px}.provider{display:block;text-align:center;color:var(--ink);font-weight:800;font-size:13px;padding:20px 12px;border:0;background:transparent;width:100%}.flow{position:absolute;inset:0;z-index:5;background:var(--bg);min-height:100%;display:none;padding-bottom:40px;animation:slide .25s ease}.flow.open{display:block}.flowhead{padding:22px;background:white;display:flex;gap:17px;align-items:center}.back{border:none;background:#f1f3f5;border-radius:13px;padding:8px 13px;font-size:22px;color:var(--ink)}.flowhead strong{font-size:18px}.flowcontent{padding:25px 22px}.eyebrow{font-size:11px;letter-spacing:1.2px;color:var(--orange);font-weight:850}.flow h2{font-size:27px;letter-spacing:-.5px;line-height:1.18;margin:10px 0 7px}.flow p{color:var(--grey);margin:0 0 24px}.question{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0}.question label{display:block;font-weight:800;margin-bottom:12px}.choices{display:flex;gap:7px;flex-wrap:wrap}.choice{border:1px solid #dce2e6;background:white;border-radius:11px;padding:10px 13px;font-size:13px;color:var(--ink)}.choice.active{background:#fff1e7;border-color:var(--orange);color:#ca5413;font-weight:800}.input{width:100%;border:1px solid #dce2e6;border-radius:12px;padding:13px;font:inherit;background:white;color:var(--ink)}.price{background:#fff3e9;border-radius:16px;padding:17px;margin:16px 0;color:#2a3642}.price b{color:#d55d17;font-size:23px}.price small{display:block;color:#875b3d}.next{width:100%;border:none;background:var(--ink);color:white;border-radius:15px;padding:17px;font-weight:800}.footnote{font-size:11px;color:var(--grey);text-align:center;margin-top:13px}.empty{background:white;border-radius:16px;padding:25px;text-align:center;color:var(--grey);line-height:1.6}.previewpill{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);background:#101820dd;color:white;font-size:11px;border-radius:20px;padding:7px 12px;z-index:9;white-space:nowrap}@keyframes slide{from{transform:translateX(18px);opacity:.5}to{transform:translateX(0);opacity:1}}@keyframes pulse{50%{box-shadow:0 8px 29px #ff7628aa}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(min-width:600px){body{padding:25px}.app{border-radius:29px;min-height:830px}.previewpill{bottom:19px}}</style></head><body><main class="app"><header class="top"><div class="brand">SUPRT<i>●</i></div><button class="history" onclick="openPage('history')">◷ Pedidos</button></header><section class="intro"><h1>Precisou? A gente chega.</h1><p>Ajuda para o carro, perto de você.</p></section><div class="address"><span class="symbol">⌖</span><div style="flex:1"><b>ONDE ESTÁ O VEÍCULO?</b><input id="address" placeholder="Digite rua, número e referência" aria-label="Endereço do veículo"></div></div><div class="map" aria-label="Mapa ilustrativo; localização real ainda não ativa"><div class="block b1"></div><div class="block b2"></div><div class="block b3"></div><div class="pin">⌖</div><div class="mapnote">Confirme o local para pedir ajuda</div></div><section class="sheet"><div class="handle"></div><h2>Qual ajuda você precisa?</h2><p>Escolha um serviço. É rápido.</p><button class="service" onclick="openPage('Pneu furado')"><span class="icon">◉</span><span class="desc"><b>Troca de pneu</b><small>Trocar pelo estepe do veículo</small></span><span class="arrow">›</span></button><button class="service" onclick="openPage('Bateria')"><span class="icon">ϟ</span><span class="desc"><b>Partida auxiliar</b><small>Ajuda com a bateria</small></span><span class="arrow">›</span></button><button class="service" onclick="openPage('Calibragem')"><span class="icon">◎</span><span class="desc"><b>Calibragem</b><small>Ar para pneu murcho</small></span><span class="arrow">›</span></button><button class="service" onclick="openPage('Guincho')"><span class="icon">↗</span><span class="desc"><b>Guincho</b><small>Remover o veículo</small></span><span class="arrow">›</span></button><div class="status">● Brasilândia · primeira região de testes</div></section><button class="provider" onclick="openPage('provider')">Quer ajudar e ganhar por isso? →</button><div id="flow" class="flow"></div></main><span class="previewpill">Prévia visual · pedidos reais ainda indisponíveis</span><script>const flow=document.getElementById('flow');let selected={};function closePage(){flow.classList.remove('open');flow.innerHTML='';selected={}}function question(name,options=['Sim','Não','Não sei']){return `<div class="question"><label>${name}</label><div class="choices">${options.map(o=>`<button class="choice" onclick="choose(this,'${name}','${o}')">${o}</button>`).join('')}</div></div>`}function choose(btn,name,value){selected[name]=value;btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}function openPage(s){let body='',title='';if(s==='history'){title='Meus pedidos';body='<div class="empty">Nenhum atendimento real foi iniciado.<br>Esta é uma visualização da interface.</div>'}else if(s==='provider'){title='Trabalhe com o SUPRT';body='<div class="empty">Pessoa física ou empresa poderá se cadastrar, informar os serviços que faz e ficar disponível para chamados próximos após aprovação.<br><br>O cadastro de prestadores ainda está sendo desenvolvido.</div>'}else{title=s==='Bateria'?'Partida auxiliar':s==='Pneu furado'?'Troca de pneu':s;body=(s==='Pneu furado'?question('Você tem estepe?')+question('O estepe está cheio?')+question('Você tem macaco?',['Sim','Não'])+question('Você tem chave de roda?',['Sim','Não']):s==='Bateria'?question('O painel acende ao tentar ligar?')+question('Seu carro é híbrido ou elétrico?')+question('Você tem cabos?',['Sim','Não']):s==='Calibragem'?question('O pneu parece furado ou danificado?'):question('O veículo pode se movimentar?'))+`<div class="question"><label>${s==='Guincho'?'Para onde levar o veículo?':'Onde está o veículo?'}</label><input class="input" placeholder="Rua, número e ponto de referência" value="${s==='Guincho'?'':escapeHtml(document.getElementById('address').value)}"></div><div class="price">${s==='Pneu furado'?'<b>R$ 69*</b><small>Teste com estepe e ferramentas do cliente; R$ 89 se o ajudante levar ferramentas. Preço final sujeito a distância.</small>':'<b>Valor a definir</b><small>Mostraremos o preço final antes de você solicitar.</small>'}</div><button class="next" onclick="alert('Esta visualização não envia pedidos. O fluxo de atendimento real ainda está em desenvolvimento.')">Continuar</button><div class="footnote">Nenhum pedido nem pagamento será feito nesta prévia.</div>`}flow.innerHTML=`<div class="flowhead"><button class="back" onclick="closePage()" aria-label="Voltar">‹</button><strong>SUPRT</strong></div><div class="flowcontent"><span class="eyebrow">${s==='history'?'HISTÓRICO':s==='provider'?'ÁREA DO AJUDANTE':'SOLICITAR AJUDA · ETAPA 1 DE 2'}</span><h2>${title}</h2><p>${s==='history'||s==='provider'?'':'Responda só o necessário para quem vai ajudar chegar preparado.'}</p>${body}</div>`;flow.classList.add('open');flow.scrollTop=0}function escapeHtml(s){return s.replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}</script></body></html>
