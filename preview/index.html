<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPRT · Visualização</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f8;color:#12253b;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:440px;margin:auto;min-height:100vh;background:#f7f9fc;box-shadow:0 10px 35px #12253b14}.top{padding:25px 24px 12px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:26px;font-weight:900;letter-spacing:-1px}.logo b{color:#1769e0}.tag{font-size:12px;color:#657488}.view{padding:16px 24px 38px}.hero{background:#12253b;border-radius:24px;padding:27px;color:white;margin-bottom:30px}.hero small{letter-spacing:2px;color:#94c1ff;font-weight:800}.hero h1{font-size:30px;line-height:1.15;margin:14px 0}.hero p{color:#c8d8ea;line-height:1.45;margin:0}.heading{font-size:22px;font-weight:850;margin:8px 0}.sub{color:#657488;line-height:1.45;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:17px;min-height:145px;text-align:left;color:#12253b;cursor:pointer}.card:active{transform:scale(.98)}.icon{font-size:30px;color:#1769e0;display:block;margin-bottom:15px}.card strong{display:block;font-size:15px}.card span:last-child{color:#657488;font-size:12px;line-height:1.35;display:block;margin-top:6px}.banner{margin-top:20px;background:#eaf2ff;border-radius:17px;padding:20px}.banner strong{display:block}.banner p{color:#657488;font-size:14px;line-height:1.45}.back{border:0;background:none;color:#1769e0;font-weight:800;font-size:16px;margin:8px 0 25px;padding:0;cursor:pointer}label{display:block;font-weight:750;font-size:14px;margin:18px 0 8px}select,input,textarea{width:100%;border:1px solid #dae2ed;border-radius:12px;background:white;padding:14px;font:inherit;color:#12253b}textarea{min-height:80px;resize:vertical}.note{background:#eaf2ff;border-radius:14px;padding:17px;margin:19px 0;color:#334f70;font-size:14px;line-height:1.5}.price{display:flex;justify-content:space-between;align-items:center;border:1px solid #dce6f5;border-radius:15px;background:white;padding:18px;margin:19px 0}.price b{font-size:25px;color:#1769e0}.button{background:#1769e0;color:white;border:0;border-radius:13px;width:100%;padding:16px;font-size:16px;font-weight:800}.muted{color:#657488;font-size:13px;line-height:1.4}.pill{display:inline-block;background:#eaf2ff;color:#1769e0;padding:7px 11px;border-radius:20px;font-weight:750;font-size:12px;margin:0 0 15px}footer{padding:10px 24px 30px;color:#768598;font-size:12px;text-align:center}</style></head><body><main class="shell"><header class="top"><div class="logo">SUPRT<b>●</b></div><div class="tag">Ajuda na estrada</div></header><div class="view" id="view"></div><footer>Visualização das telas · atendimento real ainda indisponível</footer></main><script>const view=document.getElementById('view');const cards=[['Pneu furado','◉','Trocar pelo seu estepe'],['Partida auxiliar','ϟ','Ajuda com a bateria'],['Calibragem','◎','Ar para o pneu'],['Guincho','↗','Remover o veículo']];const field=(label,id,options)=>`<label for="${id}">${label}</label><select id="${id}"><option value="">Escolha uma opção</option>${options.map(x=>`<option>${x}</option>`).join('')}</select>`;function home(){view.innerHTML=`<div class="hero"><small>SUPORTE AUTOMOTIVO</small><h1>Precisou?<br>Chamou. Chegou.</h1><p>Um imprevisto com o carro? Encontre ajuda perto de você com preço claro.</p></div><h2 class="heading">Como podemos ajudar?</h2><p class="sub">Escolha o que aconteceu. É rápido.</p><div class="grid">${cards.map((c,i)=>`<button class="card" onclick="request(${i})"><span class="icon">${c[1]}</span><strong>${c[0]}</strong><span>${c[2]}</span></button>`).join('')}</div><div class="banner"><strong>Quer ajudar alguém e ganhar por isso?</strong><p>Cadastre-se como ajudante e receba pedidos próximos quando estiver disponível.</p><button class="back" onclick="provider()">Conhecer área do prestador →</button></div>`}function request(i){let body='';if(i===0)body=field('Você tem estepe?','spare',['Sim','Não','Não sei'])+field('Seu estepe está cheio?','inflated',['Sim','Não','Não sei'])+field('Você tem macaco?','jack',['Sim','Não'])+field('Você tem chave de roda?','wrench',['Sim','Não']);if(i===1)body=field('O que acontece quando tenta ligar?','symptom',['Painel acende, motor não liga','Nada acende','Não sei'])+field('Qual o tipo do veículo?','vehicle',['Carro convencional','Híbrido','Elétrico','Não sei'])+field('Você tem cabos?','cables',['Sim','Não']);if(i===2)body=field('O pneu parece furado ou danificado?','damaged',['Não, só murcho','Sim','Não sei']);if(i===3)body=field('O carro pode ser movimentado?','movable',['Sim','Não','Não sei'])+'<label for="dest">Destino do guincho</label><input id="dest" placeholder="Para onde levar o carro?">';let price=i===0?'R$ 69*':'A calcular';view.innerHTML=`<button class="back" onclick="home()">‹ Voltar</button><div class="pill">Etapa 1 de 2 · Informe o problema</div><h2 class="heading">${cards[i][0]}</h2><p class="sub">Responda só o necessário para a pessoa chegar preparada.</p>${body}<label for="where">Onde está o veículo?</label><input id="where" placeholder="Rua, número e ponto de referência"><label for="detail">Quer acrescentar algum detalhe? (opcional)</label><textarea id="detail" placeholder="Ex.: estou em frente à farmácia"></textarea><div class="price"><span>Preço inicial de teste</span><b>${price}</b></div><p class="muted">* R$ 69 para troca pelo estepe com ferramentas do cliente, em rota curta. Com ferramentas do ajudante: teste de R$ 89. Preço final e disponibilidade devem ser confirmados antes do pedido.</p><button class="button" onclick="alert('Esta é uma visualização do design. Para solicitar atendimento real, ainda precisamos ativar despacho, aceite e pagamento.')">Continuar</button>`}function provider(){view.innerHTML=`<button class="back" onclick="home()">‹ Voltar</button><div class="pill">Área do ajudante</div><h2 class="heading">Ajude perto de você</h2><p class="sub">Pessoa física ou empresa: escolha os serviços que pode fazer e receba chamados quando estiver disponível.</p><div class="banner"><strong>Como vai funcionar</strong><p>1. Cadastro e verificação<br>2. Você ativa “Disponível”<br>3. Vê problema, distância e valor<br>4. Aceita e vai até o cliente</p></div><div class="note">Primeiro teste real: Brasilândia. Busca inicial: até 10 km, para pessoas aprovadas e disponíveis.</div><button class="button" onclick="alert('Cadastro e aceite de prestadores ainda estão em desenvolvimento.')">Entendi</button>`}home()</script></body></html>
